<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Video Yapan AI'lar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 id="mainTitle">🎬 Video Yapan Yapay Zekâlar</h1>
    <p id="subTitle">Metinden ve görselden video üreten yapay zekâ araçları</p>

    <input 
        type="text" 
        id="searchInput" 
        placeholder="🔍 Yapay zekâ ara..." 
        onkeyup="searchAI()"
        style="padding:10px; width:300px; border-radius:8px; border:none; margin:20px;"
    >
<div class="filters">
    <button onclick="filterAI('all')">Hepsi</button>
    <button onclick="filterAI('free')">🟢 Ücretsiz</button>
    <button onclick="filterAI('paid')">🔴 Ücretli</button>
</div>

    <div class="menu" id="aiContainer"></div>

    <br>
    <a href="index.html" class="home-card back-card">
    <div class="icon">🏠</div>
    <div class="text">
        <h2>Ana Sayfa</h2>
        <p>Tüm kategorilere geri dön</p>
    </div>
</a>

    <!-- ÖNCE script.js -->
    <script src="script.js"></script>

    <!-- SONRA video AI'ları yükle -->
    <script>
        loadAI("videos");
    </script>
<button id="themeToggle" onclick="toggleTheme()">
    <span id="themeIcon">🌙</span>
    <span id="themeText">Dark</span>
</button>
<div class="mobile-nav">
    <a href="index.html">🏠<span>Ana</span></a>
    <a href="images.html">🖼️<span>Resim</span></a>
    <a href="video.html">🎬<span>Video</span></a>
</div>

</body>
</html>
