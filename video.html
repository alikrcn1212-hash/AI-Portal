<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Video Yapan AI'lar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🎬 Video Yapan Yapay Zekâlar</h1>
    <p>Metinden ve görselden video üreten yapay zekâ araçları</p>

    <input 
        type="text" 
        id="searchInput" 
        placeholder="🔍 Yapay zekâ ara..." 
        onkeyup="searchAI()"
        style="padding:10px; width:300px; border-radius:8px; border:none; margin:20px;"
    >
<div class="filters">
    <button onclick="filterAI('all')">Hepsi</button>
    <button onclick="filterAI('free')">🟢 Ücretsiz</button>
    <button onclick="filterAI('paid')">🔴 Ücretli</button>
</div>

    <div class="menu" id="aiContainer"></div>

    <br>
    <a href="index.html">⬅️ Ana Sayfa</a>

    <!-- ÖNCE script.js -->
    <script src="script.js"></script>

    <!-- SONRA video AI'ları yükle -->
    <script>
        loadAI("videos");
    </script>

</body>
</html>
